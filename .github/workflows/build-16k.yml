name: Build Kernels (4 KB + 16 KB)

# Fork-only automation. WildKernels' build matrix already knows how to pass Kleaf
# --page_size=16k, but their scheduled/release runs use the 4k default. This workflow
# dispatches the existing "Build Kernels" workflow on this fork for both page sizes, so the
# fork produces its own 4 KB and 16 KB artifacts without maintaining a second build matrix.
#
# It lives on `master` (this fork's default branch). `main` stays a pristine mirror of
# WildKernels/GKI_KernelSU_SUSFS and is updated by sync-upstream.yml.

on:
  workflow_dispatch:
    inputs:
      page_size:
        description: "Page size(s) to build"
        type: choice
        options:
          - both
          - 4k
          - 16k
        default: both
      kernel_version:
        description: "GKI family"
        type: choice
        options:
          - 5.10.x-android12
          - 5.10.x-android13
          - 5.15.x-android13
          - 5.15.x-android14
          - 6.1.x-android14
          - 6.6.x-android15
          - 6.12.x-android16
          - 6.18.x-android17
        default: 6.18.x-android17
      os_patch_level:
        description: "Patch date (YYYY-MM), sublevel, lts, or All"
        type: string
        default: lts
      root_flavor:
        description: "Root implementation"
        type: choice
        options:
          - KernelSU-Next
          - KernelSU
          - BakaSU
          - SukiSU-Ultra
          - KowSU
          - FinaSU
          - No Root
        default: KernelSU-Next
      use_susfs:
        description: "Apply SUSFS (6.18 has no SUSFS branch upstream yet; it is forced off there)"
        type: boolean
        default: false
      release_type:
        description: "Release type (CI = artifacts only, no rN release)"
        type: choice
        options:
          - CI
          - Pre-Release
          - Release
        default: Pre-Release
  schedule:
    # Weekly, Monday 03:17 UTC. Scheduled workflows only run from the repository's
    # default branch, which is why `master` must be the default for this fork.
    - cron: "17 3 * * 1"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Dispatch kernel build(s)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          INPUT_PAGE_SIZE: ${{ inputs.page_size }}
          INPUT_VERSION: ${{ inputs.kernel_version }}
          INPUT_PATCH: ${{ inputs.os_patch_level }}
          INPUT_ROOT: ${{ inputs.root_flavor }}
          INPUT_SUSFS: ${{ inputs.use_susfs }}
          INPUT_RELEASE: ${{ inputs.release_type }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          ref_for() {
            # 6.12 stays on the proven r22-16k line: master's 6.12 builds still hit the
            # stock dma_buf_export module-ABI panic. Everything else builds from master.
            case "$1" in
              6.12.*) echo "r22-16k" ;;
              *) echo "$REF" ;;
            esac
          }

          # One release per batch, not per family: every dispatch in this orchestration
          # shares a computed tag (4 KB and 16 KB are separate lines, as elsewhere).
          next_tag() {
            local prefix="$1" latest
            latest=$(gh api --paginate "repos/${{ github.repository }}/tags?per_page=100" \
              --jq '.[].name' 2>/dev/null | grep -E "^r[0-9]+${prefix}$" \
              | sed -E 's/^r([0-9]+).*/\1/' | sort -n | tail -1 || true)
            echo "r$(( ${latest:-0} + 1 ))${prefix}"
          }
          BATCH_4K=""
          BATCH_16K=""
          if [ "$INPUT_RELEASE" != "CI" ]; then
            BATCH_4K="$(next_tag "")"
            BATCH_16K="$(next_tag "-16k")"
            echo "Batch release tags: 4K=$BATCH_4K 16K=$BATCH_16K"
          fi

          dispatch() {
            local pages="$1" version="$2" patch="$3" root="$4" susfs="$5" release="$6"
            if [ "$version" = "6.18.x-android17" ] && [ "$susfs" = "true" ]; then
              echo "::warning::SUSFS has no gki-android17-6.18 branch upstream; building $version without SUSFS."
              susfs=false
            fi
            local rtag=""
            if [ "$release" != "CI" ]; then
              if [ "$pages" = "16k" ]; then rtag="$BATCH_16K"; else rtag="$BATCH_4K"; fi
            fi
            echo "Dispatching Build Kernels: version=$version page_size=$pages root=$root susfs=$susfs release=$release tag=${rtag:-auto} ref=$(ref_for "$version")"
            gh workflow run main.yml \
              --ref "$(ref_for "$version")" \
              -f release_type="$release" \
              -f kernel_build_version="$version" \
              -f os_patch_level="$patch" \
              -f page_size="$pages" \
              -f root_flavor="$root" \
              -f use_susfs="$susfs" \
              -f commit_mode=verified \
              -f release_tag="$rtag"
          }

          supports_16k() {
            # Kleaf exposes --page_size only on the android14-6.1+ build branches.
            # 5.10/5.15 are 4 KB only.
            case "$1" in
              6.1.*|6.6.*|6.12.*|6.18.*) return 0 ;;
              *) return 1 ;;
            esac
          }

          dispatch_pair() {
            local version="$1" patch="$2" root="$3" susfs="$4" release="$5" pages="$6"
            if ! supports_16k "$version"; then
              case "$pages" in
                both)
                  echo "::warning::$version is 4 KB only (no Kleaf page-size support); skipping the 16 KB leg."
                  pages=4k
                  ;;
                16k)
                  echo "::error::$version has no 16 KB build support; choose 4k or both." >&2
                  exit 1
                  ;;
              esac
            fi
            case "$pages" in
              both) dispatch 4k "$version" "$patch" "$root" "$susfs" "$release"
                    dispatch 16k "$version" "$patch" "$root" "$susfs" "$release" ;;
              4k|16k) dispatch "$pages" "$version" "$patch" "$root" "$susfs" "$release" ;;
              *) echo "unsupported page_size '$pages'" >&2; exit 1 ;;
            esac
          }

          if [ "$EVENT" = "schedule" ]; then
            # Full GKI coverage, Android 12 through 17. 16 KB exists only for the Kleaf
            # families (android14-6.1 and newer); 5.10/5.15 build 4 KB only. 6.18 forces
            # SUSFS off (no susfs4ksu branch upstream yet).
            dispatch_pair "6.18.x-android17" "lts" "KernelSU-Next" "false" "Pre-Release" "both"
            dispatch_pair "6.12.x-android16" "lts" "KernelSU-Next" "true" "Pre-Release" "both"
            dispatch_pair "6.6.x-android15" "lts" "KernelSU-Next" "true" "Pre-Release" "both"
            dispatch_pair "6.1.x-android14" "lts" "KernelSU-Next" "true" "Pre-Release" "both"
            dispatch_pair "5.15.x-android14" "lts" "KernelSU-Next" "true" "Pre-Release" "4k"
            dispatch_pair "5.15.x-android13" "lts" "KernelSU-Next" "true" "Pre-Release" "4k"
            dispatch_pair "5.10.x-android13" "lts" "KernelSU-Next" "true" "Pre-Release" "4k"
            dispatch_pair "5.10.x-android12" "lts" "KernelSU-Next" "true" "Pre-Release" "4k"
          else
            dispatch_pair \
              "${INPUT_VERSION:-6.18.x-android17}" \
              "${INPUT_PATCH:-lts}" \
              "${INPUT_ROOT:-KernelSU-Next}" \
              "${INPUT_SUSFS:-false}" \
              "${INPUT_RELEASE:-Pre-Release}" \
              "${INPUT_PAGE_SIZE:-both}"
          fi
